<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        AI Data Analyst
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="logo">
            AI Data Analyst
        </div>

        <div class="subtitle">
            Upload your data. Ask questions. Get insights.
        </div>

    </header>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="container">


        <!-- =================================================
             UPLOAD SECTION
        ================================================== -->

        <section class="card">

            <h2>
                Upload CSV Dataset
            </h2>

            <p class="description">
                Upload a CSV file and let AI analyze your data.
            </p>


            <input
                type="file"
                id="fileInput"
                accept=".csv"
                hidden
            >


            <button
                id="uploadButton"
                class="primary-button"
            >
                Choose CSV File
            </button>


            <div
                id="fileName"
                class="file-name"
            >
                No file selected
            </div>

        </section>


        <!-- =================================================
             QUESTION SECTION
        ================================================== -->

        <section class="card">

            <h2>
                Ask Your Data
            </h2>

            <p class="description">
                Ask a question about your CSV dataset.
            </p>


            <textarea
                id="questionInput"
                placeholder="Example: Which product sells the most?"
                rows="3"
            ></textarea>


            <button
                id="askButton"
                class="primary-button"
            >
                Analyze Data
            </button>

        </section>


        <!-- =================================================
             RESULT SECTION
        ================================================== -->

        <section
            id="resultContainer"
            class="result-section"
            style="display: none;"
        >

            <div id="answerContainer"></div>

            <div
                id="chartContainer"
                style="display: none;"
            ></div>

        </section>


    </main>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="footer">

        AI Data Analyst © 2026

    </footer>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        src="script.js"
    ></script>

</body>

</html>
